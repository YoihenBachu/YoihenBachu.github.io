# Site settings

# NB! Set your site's url, otherwise nothing will work
url: "https://yoihenbachu.github.io"
baseurl: ""

# Google tracking id
google-tracking-id: "UA-XXXXXXXX-X"

#############
# HTML Head #
#############

lang: "en"
author: "Yoihenba"
title: "Yoihenba's Mahei Pukkei"
description: "Blog and website of Yoihenba, blogging mainly for tech. Opinions expressed are mine."
keywords: "yoihenba, personal, jekyll, theme"
favicon: "/img/favicon.ico"
################
# Header layout#
################
black-favicon: "/img/black-lab-glass.ico"
background-img: "intro-bg.jpg"

##############################
# Dynamic Text on the Header #
##############################

quote: "Where’s your will to be weird?"
me-img: "/img/jetpacktocat.png"

# To use github profile pic uncomment the following line and replace 'user_name'
# with your github user name.

# me-img: "https://github.com/user_name.png?size=500"

# To use gravatar profile pic uncomment the following line and replace 'email_hash'
# with your gravatar profile email hash.
# You can create the email hash by using an online tool like 'http://www.md5hashgenerator.com/'
# just enter your email and it will generate the hash.

# me-img: "https://www.gravatar.com/avatar/email_hash?s=500"

#######
# Blog #
########

post-preview-words: 96
paginate: 12
email-share: True
fb-share: True
linkedin-share: True
reddit-share: True
x-share: True
hackernews-share: True
tumblr-share: True
pinterest-share: True
pocket-share: True
vkontakte-share: True

disqus-shortname: "Yoihenba's Pukkei"

############
# Timeline #
############

events:
  # - image: "/img/timeline/spidertocat.png"
  #   date: "September 2013 - Today"
  #   description: "Saving the neighborhood!"
  # - image: "/img/timeline/baracktocat.jpg"
  #   date: "September 2007 - August 2013"
  #   description: "Started coding"

# First image of the Timeline
# timeline-img: "/img/timeline/default.png"

###########
# Contact #
###########

email: "thdamyoihenba@gmail.com"

################
# Author Blurb #
################

# The author blurb goes underneath blog posts.
# This works best when your author blurb image has a transparent background, or matches your site background color.

author_blurb_image: "/img/author.png"
author_blurb:
  "'Mahei' in Meiteilon means 'Knowledge' and 'Pukkei' meaning 'Collection'. 
  Hence, the name 'Mahei Pukkei' conveying the message that I will dropping whatever I have learned in this 'Collection of Knowledge'.
  I am Yoihenba, a Data Scientist who loves to write about technology, programming, and various other topics. 
  Welcome to my personal blog where I share my thoughts and experiences. You don't have a choice but to agree with my opinions!"

##################
# Social Buttons #
##################

social:
  - icon: "github"
    url: "https://github.com/YoihenBachu"
  - icon: "linkedin-in"
    url: "https://www.linkedin.com"
  - icon: "x-twitter"
    url: "https://twitter.com/"
  - icon: "rss"
    url: "https://le4ker.github.io/personal-jekyll-theme/feed.xml"

# NB! Tread carefully if you want to change the variables below this point!

# Sections shown in the index page
pages_list:
  About: "about"
  Blog: "latest-post"
  # Timeline: "timeline"
  Contact: "contact"

syntax_theme: everforest

# Exclusion list from the generated _site
exclude:
  - LICENSE
  - README.md
  - CONTRIBUTING
  - CONTRIBUTORS
  - scripts
  - Dockerfile
  - docker-compose.yml
# Pagination path
paginate_path: "blog/page:num/"
# Enable minification SASS
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-spaceship
